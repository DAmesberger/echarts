<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/testHelper.js"></script>
        <link rel="stylesheet" href="lib/reset.css" />
    </head>
    <body>
        <style>
            h1 {
                line-height: 60px;
                height: 60px;
                background: #ddd;
                text-align: center;
                font-weight: bold;
                font-size: 14px;
            }
            .chart {
                height: 400px;
            }
        </style>

        <h1>nearestSeries: true | trigger: 'axis' | Only nearest series shown in tooltip</h1>
        <div class="chart" id="nearest-on"></div>

        <h1>nearestSeries: false (default) | trigger: 'axis' | All series shown in tooltip</h1>
        <div class="chart" id="nearest-off"></div>

        <h1>nearestSeries: true | dual Y axes (different scales) | pixel distance normalizes scales</h1>
        <div class="chart" id="nearest-dual-axis"></div>

        <script>
        require(['echarts'], function (echarts) {

            var xData = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            var seriesData = [
                {name: 'Series A', data: [120, 200, 150, 80, 70, 110, 130]},
                {name: 'Series B', data: [60, 80, 70, 190, 200, 160, 100]},
                {name: 'Series C', data: [150, 130, 160, 120, 140, 180, 90]}
            ];

            // --- nearestSeries: true ---
            var chart1 = echarts.init(document.getElementById('nearest-on'));
            chart1.setOption({
                tooltip: {
                    trigger: 'axis',
                    nearestSeries: true
                },
                legend: {},
                xAxis: {type: 'category', data: xData},
                yAxis: {type: 'value'},
                series: seriesData.map(function (s) {
                    return {type: 'line', name: s.name, data: s.data};
                })
            });

            // --- nearestSeries: false (default) ---
            var chart2 = echarts.init(document.getElementById('nearest-off'));
            chart2.setOption({
                tooltip: {
                    trigger: 'axis'
                },
                legend: {},
                xAxis: {type: 'category', data: xData},
                yAxis: {type: 'value'},
                series: seriesData.map(function (s) {
                    return {type: 'line', name: s.name, data: s.data};
                })
            });

            // --- nearestSeries: true with dual Y axes ---
            var chart3 = echarts.init(document.getElementById('nearest-dual-axis'));
            chart3.setOption({
                tooltip: {
                    trigger: 'axis',
                    nearestSeries: true
                },
                legend: {},
                xAxis: {type: 'category', data: xData},
                yAxis: [
                    {type: 'value', name: 'Temperature (C)', position: 'left'},
                    {type: 'value', name: 'Percentage (%)', position: 'right', max: 100}
                ],
                series: [
                    {type: 'line', name: 'Temperature', yAxisIndex: 0, data: [22, 25, 28, 30, 27, 24, 21]},
                    {type: 'line', name: 'Humidity', yAxisIndex: 1, data: [65, 70, 80, 55, 50, 60, 75]}
                ]
            });

        });
        </script>
    </body>
</html>
